# Supabase's free plan pauses a project after 7 days without activity,
# which takes accounts, sync and leaderboards offline. This runs a tiny
# real database query every 3 days so the project always counts as active.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 9 */3 * *" # 09:17 UTC on every third day of the month
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query the leaderboard
        run: |
          # the URL and anon key are public; they're already in the site's config
          URL=$(grep -o 'supabaseUrl: "[^"]*"' assets/config.js | cut -d'"' -f2)
          KEY=$(grep -o 'supabaseAnonKey: "[^"]*"' assets/config.js | cut -d'"' -f2)
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/leaderboard" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Supabase answered HTTP $code"
          test "$code" = "200"
