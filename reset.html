<script>
(function () {
  var A = window.EdgeAuth, m = document.getElementById("rmsg"), f = document.getElementById("rf");
  if (!A.configured) { m.textContent = "Accounts aren't available yet."; return; }
  A.onChange(function (u) {
    if (u) { m.textContent = "Choose a new password for " + u.email + "."; f.hidden = false; }
    else { m.innerHTML = 'This link has expired or was already used. <a href="login.html">Request a new one</a>.'; f.hidden = true; }
  });
  f.addEventListener("submit", function (e) {
    e.preventDefault(); var fb = f.querySelector(".fb"), pw = document.getElementById("r-pw").value;
    if (pw.length < 8) { fb.className = "fb bad"; fb.textContent = "Use at least 8 characters."; return; }
    A.updatePassword(pw).then(function () { fb.className = "fb good"; fb.textContent = "Password saved. Taking you to practice…"; setTimeout(function () { location.href = "app.html#today"; }, 1200); },
      function (err) { fb.className = "fb bad"; fb.textContent = "Couldn't save it: " + err.message; });
  });
})();
</script>
