# Netlify settings for Edge (a static site: no build step)
[build]
  publish = "."

# Always check for fresh HTML; versioned assets (?v=...) can be cached long
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# every page links these with a ?v= version stamp (tools/bump_version.py), so a release never serves a stale copy
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The site moved to getedgeprep.com (Cloudflare Pages); keep old links and bookmarks working
[[redirects]]
  from = "https://edgeprep.netlify.app/*"
  to = "https://getedgeprep.com/:splat"
  status = 301
  force = true

# Unknown URLs show the site's 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
