# Netlify settings for Edge (a static site: no build step)
[build]
  publish = "."

# Always check for fresh HTML; versioned assets (?v=...) can be cached long
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Unknown URLs show the site's 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
